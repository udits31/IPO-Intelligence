[project]
name = "ipo-intelligence-system"
version = "0.1.0"
description = "Indian IPO Intelligence System: Dual-Track Prediction Pipeline and Web Application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "supabase>=2.3.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "pymupdf>=1.24.0",
    "google-generativeai>=0.4.0",
    "yfinance>=0.2.37",
    "xgboost>=2.0.3",
    "scikit-learn>=1.4.0",
    "feedparser>=6.0.11",
    "tenacity>=8.2.3",
    "matplotlib>=3.8.3",
    "sqlglot==30.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: optional network smoke tests requiring a running backend and external providers"]

